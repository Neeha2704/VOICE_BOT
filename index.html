<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neehamadhuri – AI Voice Bot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Ambient background -->
  <div class="bg-blobs">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>

  <div class="container">

    <!-- Header -->
    <header class="header">
      <div class="avatar-wrap">
        <div class="avatar-ring">
          <div class="avatar-core">N</div>
        </div>
        <div class="online-dot"></div>
      </div>
      <div class="header-text">
        <h1>Neehamadhuri <span class="italic">Barakala</span></h1>
        <p class="subtitle">AI Voice Bot &nbsp;·&nbsp; 100x AI Engineer Assessment</p>
      </div>
    </header>

    <!-- Chat window -->
    <section class="chat-window" id="chatWindow">
      <div class="message bot" id="welcomeMsg">
        <div class="msg-avatar">N</div>
        <div class="msg-bubble">
          Hi there! 👋 I'm Neehamadhuri's AI twin. Ask me anything about her — 
          her background, skills, goals, or personality. 
          Tap the mic to speak, or type below!
        </div>
      </div>
    </section>

    <!-- Speaking visualizer -->
    <div class="visualizer" id="visualizer">
      <div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div>
      <div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div>
      <div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div>
    </div>

    <!-- Input area -->
    <div class="input-area">
      <button class="mic-btn" id="micBtn" title="Click to speak">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
      <div class="text-wrap">
        <input type="text" id="textInput" class="text-input" placeholder="Type your question…" autocomplete="off" />
        <button class="send-btn" id="sendBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>

    <p class="mic-status" id="micStatus">tap mic to speak</p>

    <!-- Quick questions -->
    <div class="quick-section">
      <p class="quick-label">Try asking —</p>
      <div class="quick-pills" id="quickPills">
        <button class="pill">What's your life story?</button>
        <button class="pill">What's your #1 superpower?</button>
        <button class="pill">Top 3 areas to grow in?</button>
        <button class="pill">What misconception do people have about you?</button>
        <button class="pill">How do you push your limits?</button>
        <button class="pill">Tell me about your projects</button>
        <button class="pill">What are your technical skills?</button>
        <button class="pill">What are your achievements?</button>
      </div>
    </div>

  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
